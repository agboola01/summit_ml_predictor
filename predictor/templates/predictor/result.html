{% extends 'predictor/base.html' %}
{% block title %}Prediction Result{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6 mt-8">
    <h2 class="text-2xl font-bold mb-4">{{ model_name }} Result</h2>
    <div class="border rounded-lg p-4 bg-gray-50">
        <p class="text-lg">Prediction: <span class="font-semibold">{{ prediction }}</span></p>
        {% if probability is not None %}
        <p class="text-lg mt-2">Confidence: <span class="font-semibold">{{ probability|floatformat:2 }}</span> (probability)</p>
        {% endif %}
    </div>
    <div class="mt-6">
        <a href="{% url 'predictor:home' %}" class="text-blue-600 hover:underline">← Back to Home</a>
    </div>
</div>
{% endblock %}
