{% extends 'predictor/base.html' %}
{% block title %}Prediction Result{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6 mt-8">
    <h2 class="text-2xl font-bold mb-4">{{ model_name }} Report</h2>
    <div class="border rounded-lg p-4 {% if prediction == 1 %}bg-red-50 border-red-200{% else %}bg-green-50 border-green-200{% endif %}">
        <p class="text-lg">{{ result_sentence|safe }}</p>
        {% if confidence is not None %}
        <p class="text-lg mt-2">Confidence: <span class="font-bold">{{ confidence }}%</span></p>
        {% endif %}
    </div>
    <a href="{% url 'predictor:home' %}" class="mt-4 inline-block text-blue-600 hover:underline">← Back to Home</a>
</div>
{% endblock %}
