{% extends 'predictor/base.html' %}
{% block title %}Biomass Yield Predictor{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
    <h2 class="text-2xl font-bold mb-6">Biomass Weight Estimation</h2>
    <form method="post" class="bg-white shadow-md rounded-lg p-6">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg">Predict</button>
    </form>
</div>
{% endblock %}
