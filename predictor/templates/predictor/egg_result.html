{% extends 'predictor/base.html' %}
{% block title %}Egg Production Result{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white rounded-lg shadow-md p-6 mt-8">
    <h2 class="text-2xl font-bold mb-4">Egg Production Prediction</h2>
    <div class="border rounded-lg p-4 bg-gray-50 mb-6">
        <p class="text-lg">Predicted daily egg yield: <span class="font-semibold">{{ egg_per_day }} eggs/day</span></p>
    </div>

    <div class="mt-6">
        <label for="days_input" class="block text-sm font-medium text-gray-700">Enter number of days</label>
        <div class="flex mt-2 space-x-2">
            <input type="number" id="days_input" value="1" min="1" class="w-24 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="calculateTotal()" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">Calculate Total Eggs</button>
        </div>
        <p id="total_result" class="mt-3 text-lg font-semibold text-green-700"></p>
    </div>

    <div class="mt-6">
        <a href="{% url 'predictor:egg' %}" class="text-blue-600 hover:underline">← New Prediction</a>
        &nbsp;|&nbsp;
        <a href="{% url 'predictor:home' %}" class="text-blue-600 hover:underline">Home</a>
    </div>
</div>

<script>
function calculateTotal() {
    const days = document.getElementById('days_input').value;
    const eggPerDay = {{ egg_per_day|floatformat:1 }};
    const total = Math.round(eggPerDay * days);
    document.getElementById('total_result').innerText = `Estimated total eggs over ${days} day(s): ${total}`;
}
// Initial calculation
window.onload = function() { calculateTotal(); }
</script>
{% endblock %}
